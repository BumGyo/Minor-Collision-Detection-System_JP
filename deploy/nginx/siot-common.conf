# SIOT — フロントエンド（ビルド生成物）と /api（バックエンド）を同一オリジンで提供。下記2つの server 設定で共用。
# deploy/install.sh により /etc/nginx/snippets/siot-common.conf へ配置されます。

root /var/www/siot;   # ui/dist を install.sh がここへ配置（nginx から /home 配下の直接読み込みを防止）
index index.html;

# CCTV 原本動画アップロード — nginx 既定上限(1MB)を解除（容量上限はディスク残量依存）、
# 受信データをそのまま即座にバックエンドへストリーミング（nginx 一時ファイルへの二重書き込みを防止）
client_max_body_size 0;
client_body_timeout 300s;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# 基本セキュリティヘッダー — 下記の各 location 内で個別 add_header を行わないことで全域に継承（nginx 継承仕様）
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;

# ログイン・会員登録 — リクエスト頻度制限（zone は siot-http/https.conf で定義）、超過時はフロント側で処理できるよう JSON 429 を返却
location ~ ^/api/auth/(login|signup)$ {
    limit_req zone=siot_auth burst=10 nodelay;
    limit_req_status 429;
    error_page 429 = @siot_too_many;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @siot_too_many {
    default_type application/json;
    return 429 '{"detail":"リクエストが多すぎます。しばらく待ってから再試行してください。"}';
}

location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;   # 大容量アップロードをバッファリングせず即時ストリーミング
    proxy_buffering off;           # 動画再生（Range リクエスト）も即時ストリーミング
    # アップロード後の動画メタデータ抽出・車両検知（YOLO、CPUサーバーでの長時間処理を許容）を待機
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

# ビルド生成物（js・css）はファイル名にコンテンツハッシュが含まれるため長期キャッシュを許可
location /assets/ {
    expires 30d;
    try_files $uri =404;
}

# SPAルーティング（/videos/12 等）はすべて index.html へフォールバック — React Router が処理（リロード時の 404 防止）
location / {
    try_files $uri $uri/ /index.html;
    expires -1;   # Cache-Control: no-cache — 新規デプロイ時に即時反映
}
