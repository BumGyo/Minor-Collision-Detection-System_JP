# SIOT — HTTPS。certbot により証明書を取得後(/etc/letsencrypt/live/__DOMAIN__/) install.sh が本設定を使用します。
# ログイン・会員登録リクエスト制限（同一IPあたり毎分10回、バースト10回まで） — パスワード総当たり攻撃を防止。
# siot-common.conf の /api/auth/(login|signup) で使用
limit_req_zone $binary_remote_addr zone=siot_auth:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include snippets/siot-common.conf;
}
