# SIOT — HTTPS。certbot による証明書取得後（/etc/letsencrypt/live/__DOMAIN__/）に install.sh が使用。
# ログイン・会員登録のリクエスト制限（同一IPあたり1分間10回、バースト10回まで） — ブルートフォース攻撃防止。
# siot-common.conf の /api/auth/(login|signup) が参照
limit_req_zone $binary_remote_addr zone=siot_auth:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include snippets/siot-common.conf;
}
