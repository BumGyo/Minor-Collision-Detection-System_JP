# SIOT — HTTP 専用（SSL証明書取得前、またはドメインなしのIP直接アクセス時）。
# deploy/install.sh が __DOMAIN__ を置換して /etc/nginx/sites-available/siot.conf へ配置。
# ログイン・会員登録のリクエスト制限（同一IPあたり1分間10回、バースト10回まで） — ブルートフォース攻撃防止。
# siot-common.conf の /api/auth/(login|signup) が参照
limit_req_zone $binary_remote_addr zone=siot_auth:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__;

    include snippets/siot-common.conf;
}
