services:
  db:
    image: mysql:8.0
    environment:
      # パスワードはプロジェクトルート .env の MYSQL_ROOT_PASSWORD (未設定時は開発用デフォルト)
      # ⚠️ 初回DB作成時のみ適用 — 既存ボリューム (mysql_data) のパスワードは変更されない
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: capstone_db
    ports:
      # ローカル (127.0.0.1) のみバインド — 外部公開を防止
      - "127.0.0.1:3306:3306"
    # データ永続化: named volume を MySQL データディレクトリにマウント
    # (コンテナ削除・再作成時も mysql_data ボリュームのデータは保持)
    volumes:
      - mysql_data:/var/lib/mysql
    # Docker 起動時に自動起動
    restart: unless-stopped

  redis:
    image: redis:alpine
    # AOF 永続化の有効化 + ボリューム (Celeryタスクキュー/結果保持用)
    # パスワードは .env の REDIS_PASSWORD — 未設定時はパスワードなしで稼働 (開発用)
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
