services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-capstone_db}
    ports:
      # Loopback only; MYSQL_PORT defaults to the port in the local DB URL.
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    # データ永続化: named volume を MySQL データディレクトリにマウント
    # (コンテナを削除・再作成しても mysql_data ボリュームにデータが維持される)
    volumes:
      - mysql_data:/var/lib/mysql
    # Docker(デーモン/Desktop)起動時に自動起動 — 再起動後も手動実行不要
    restart: unless-stopped

  redis:
    image: redis:alpine
    # AOF persistence; authenticate only when a password is configured.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
        else
          exec redis-server --appendonly yes;
        fi
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
